name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '^10.0'
            testbench: '^8.0'
            filament: '^3.3'
          - php: '8.2'
            laravel: '^11.0'
            testbench: '^9.0'
            filament: '^3.3'
          - php: '8.2'
            laravel: '^11.0'
            testbench: '^9.0'
            filament: '^4.0'
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.0'
            filament: '^3.3'
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.0'
            filament: '^4.0'
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / Filament ${{ matrix.filament }}
    # The redis driver tests talk to a real server, and the MySQL tests cover
    # what SQLite cannot: upsert evaluation order and the index key limit.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: queue_monitor_test
        ports:
          - 3306:3306
        options: --health-cmd "mysqladmin ping -h 127.0.0.1" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      QUEUE_MONITOR_TEST_MYSQL_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql, redis
          coverage: none
          tools: composer:v2
      - run: composer validate --strict --no-check-lock
      - name: Resolve compatibility dependencies
        run: |
          composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-update
          composer require "filament/filament:${{ matrix.filament }}" --no-update
          composer update --prefer-dist --no-interaction --no-security-blocking
      - run: composer test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-dist --no-interaction
      - run: composer audit
